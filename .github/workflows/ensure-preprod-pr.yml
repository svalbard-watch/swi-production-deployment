name: Ensure pre-prod promotion PR exists

# Reconciliation, not just reaction: opens a staging/X.Y.Z -> pre-prod PR whenever a
# staging branch has commits pre-prod doesn't have yet, and keeps checking on a
# schedule so a missed/failed trigger doesn't leave it silently missing (this is
# exactly the gap we hit: cutting the next staging branch made it correctly, but
# nothing ever opened the PR to promote it). Doesn't merge anything - promoting to
# pre-prod stays a deliberate human decision, this just makes sure the PR is there to
# make it. Also covers re-promotion: a fix pushed to staging/X.Y.Z after its first
# promotion shows up as new commits ahead of pre-prod, and gets its own PR here too.

on:
  push:
    branches:
      - 'staging/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  open-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check pre-prod exists
        id: preprod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/pre-prod" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "pre-prod doesn't exist yet - nothing to do (this is a one-time bootstrap step, not something this workflow creates)."
          fi

      - name: List staging/* branches
        if: steps.preprod.outputs.exists == 'true'
        id: branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/branches?per_page=100" \
            --jq '[.[] | select(.name | startswith("staging/")) | .name] | join("\n")' \
            > staging_branches.txt
          cat staging_branches.txt

      - name: Open or update promotion PRs for each staging branch
        if: steps.preprod.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pyyaml: scripts/promotion_summary.py imports update-info.py, which needs it.
          python3 -m pip install --quiet pyyaml

          # Same table as the production PR (see open-production-pr.yml): what this branch
          # changes compared with what pre-prod runs now. The body is rewritten on every run,
          # so bumps landing on the staging branch show up in the open PR.
          body_for() {
            branch="$1"
            tmp=$(mktemp -d)
            git show "origin/pre-prod:info/version.json" > "$tmp/base.json"
            git show "origin/$branch:info/version.json" > "$tmp/head.json"
            args=("$tmp/base.json" "$tmp/head.json")
            if git show "origin/$branch:info/.release-baseline.json" > "$tmp/baseline.json" 2>/dev/null; then
              args+=("$tmp/baseline.json")
            fi
            if [ -f scripts/promotion_summary.py ] && summary=$(python3 scripts/promotion_summary.py "${args[@]}"); then
              printf 'Promotes `%s` to pre-prod, which deploys it to staging. Merge when ready.\n\n%s\n' "$branch" "$summary"
            else
              printf 'Opened automatically - `%s` has commits pre-prod does not have yet. Merge when ready to deploy to staging.\n' "$branch"
            fi
          }

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue

            existing=$(gh pr list --head "$branch" --base pre-prod --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              echo "$branch: PR #$existing already open into pre-prod - refreshing its description"
              gh pr edit "$existing" --body "$(body_for "$branch")"
              continue
            fi

            if [ -z "$(git rev-list "origin/pre-prod..origin/$branch" 2>/dev/null)" ]; then
              echo "$branch: no commits ahead of pre-prod - nothing to promote"
              continue
            fi

            echo "$branch: opening promotion PR"
            gh pr create --head "$branch" --base pre-prod \
              --title "Promote $branch to pre-prod" \
              --body "$(body_for "$branch")"
          done < staging_branches.txt
