name: Scan deployed images

# Image security gate: scans every image referenced by stack.yml, not just the ones this
# organisation builds. A service repository only scans its image when its own CI runs, so a
# base image fix released later (OpenSSL, libpcre2, ...) would go unnoticed in production;
# redis and nginx have no CI at all.
#
# One Trivy job per image (the matrix), then the `gate` job combines the reports into a single
# pass/fail check, "Image security gate", and posts the result as a comment on the promotion
# PR. A fixable HIGH/CRITICAL finding in an enforced image fails the gate until a devops-team
# member acknowledges it from the PR (/ignore, see pr-commands.yml); acknowledgements are per PR
# and dated. Images with a current entry in .github/image-scan-exceptions.json are reported
# but never fail. Runs on every promotion PR (no paths filter, like the smoke test) and daily.

on:
  schedule:
    - cron: "30 4 * * *"
  pull_request:
    branches: [pre-prod, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: List the images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test the helper script
        run: python3 -m unittest discover -s tests -p 'test_scan_images.py' -v

      - name: Build the scan matrix from stack.yml
        id: build
        run: |
          set -euo pipefail
          MATRIX="$(python3 scripts/scan_images.py matrix stack.yml .github/image-scan-exceptions.json)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | python3 -m json.tool

  scan:
    name: Scan ${{ matrix.name }} (${{ matrix.mode }})
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull the private swi-frontend image
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      IMAGE: ${{ matrix.image }}
      NAME: ${{ matrix.name }}
      MODE: ${{ matrix.mode }}
      NOTE: ${{ matrix.note }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        # swi-frontend is a private package: its "Manage Actions access" setting must
        # grant this repository read access. Harmless for the public images. The login is
        # stored per registry in ~/.docker/config.json, which Trivy reads below, so the
        # token is never offered to Docker Hub for redis and nginx.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Scanned straight from the registry: no pull, no Docker daemon image export (which
      # cannot export multi-platform images that carry build attestations).
      - name: Scan with Trivy
        run: |
          docker run --rm -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" -v "$PWD:/out" \
            ghcr.io/aquasecurity/trivy:0.75.0 image --image-src remote --timeout 15m --quiet \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output /out/trivy.json "$IMAGE"

      - name: Report the findings
        run: |
          set -euo pipefail
          {
            echo "### $IMAGE ($MODE)"
            if [ -n "$NOTE" ]; then echo "> $NOTE"; fi
            python3 scripts/scan_images.py summary trivy.json | grep -v '^findings='
          } >> "$GITHUB_STEP_SUMMARY"
          # The verdict is the gate job's: this job only fails when the scan itself broke.
          mv trivy.json "$NAME.json"

      - name: Keep the report for the gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.name }}
          path: ${{ matrix.name }}.json
          retention-days: 7

  gate:
    name: Image security gate
    needs: [matrix, scan]
    # Also when a scan job failed: a missing report must fail the gate, not skip it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the result comment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATRIX: ${{ needs.matrix.outputs.matrix }}
      PR: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the scan reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: trivy-*
          path: reports
          merge-multiple: true

      - name: Read the acknowledgements stored in the PR comment
        run: |
          set -euo pipefail
          : > comment-id.txt
          if [ -n "$PR" ]; then
            # Only the comment written by this workflow's bot counts: nobody else can forge an acknowledgement.
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments"               --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- swi-image-gate -->"))) | .id'               | head -1 > comment-id.txt
          fi
          : > old-comment.md
          if [ -s comment-id.txt ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$(cat comment-id.txt)" --jq .body > old-comment.md
          fi
          python3 scripts/scan_images.py acks old-comment.md > acks.json
          cat acks.json

      - name: Combine the reports
        id: verdict
        run: |
          set -euo pipefail
          echo "$MATRIX" > matrix.json
          python3 scripts/scan_images.py aggregate matrix.json reports acks.json comment.md | tee verdict.txt
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          cat verdict.txt >> "$GITHUB_OUTPUT"

      - name: Post the result on the PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ -s comment-id.txt ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$(cat comment-id.txt)" -F body=@comment.md >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

      - name: Fail when the gate failed
        if: steps.verdict.outputs.verdict != 'pass'
        run: |
          echo "::error::Image security gate failed - see the PR comment or the job summary"
          exit 1
